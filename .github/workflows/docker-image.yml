name: Docker image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish bot image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::El tag ($GITHUB_REF_NAME) no coincide con la versión de package.json ($PKG_VERSION)."
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Compute image tags
        run: |
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/wfh-watcher"
          TAGS="$IMAGE:v$VERSION"
          # Las pre-releases (1.2.0-rc.1) no pisan `latest`.
          case "$VERSION" in
            *-*) ;;
            *) TAGS="$TAGS"$'\n'"$IMAGE:latest" ;;
          esac
          {
            echo "IMAGE_TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
